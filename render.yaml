services:
  - type: web
    name: urlsnip-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: env_name
        value: Production
      - key: base_url
        value: https://urlsnip-api.onrender.com
      - key: allowed_origins
        value: https://urlsnip.ca,https://www.urlsnip.ca
      - key: db_url
        sync: false
